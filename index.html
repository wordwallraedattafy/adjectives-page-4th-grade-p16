<style>
:root{--bg1:#74b9ff;--bg2:#a29bfe;--card:#fff;--ink:#2d3436;--ok:#00b894;--bad:#ff7675;--pri:#6c5ce7;--sun:#fdcb6e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2d3a8c;--bg2:#5b3f9e}}
:root[data-theme="dark"]{--bg1:#2d3a8c;--bg2:#5b3f9e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:"Baloo 2","Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;-webkit-user-select:none;user-select:none}
.deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.deco i{position:absolute;font-style:normal;font-size:38px;opacity:.35;animation:fl 9s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-24px) rotate(12deg)}}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:14px 14px 10px}
.card{background:var(--card);border-radius:28px;padding:20px;box-shadow:0 10px 0 rgba(0,0,0,.12),0 18px 40px rgba(0,0,0,.18)}
h1{font-size:clamp(30px,8vw,46px);margin:6px 0;color:var(--pri);text-align:center;line-height:1.05}
.hero{font-size:84px;text-align:center;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) scale(1.06)}}
p.lead{text-align:center;font-size:20px;margin:8px 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.chips span{background:#f1f0ff;color:var(--pri);border-radius:999px;padding:6px 14px;font-weight:700;font-size:18px}
button{font:inherit;cursor:pointer;border:0}
.big{display:block;margin:0 auto;background:linear-gradient(#ffb142,#ff793f);color:#fff;font-size:30px;font-weight:800;padding:14px 44px;border-radius:999px;box-shadow:0 7px 0 #cc5a1f;transition:transform .1s}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 #cc5a1f}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:#fff;font-weight:800;font-size:20px}
.pill{background:rgba(255,255,255,.25);border-radius:999px;padding:4px 14px;white-space:nowrap}
.bar{flex:1;height:16px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden}
.bar b{display:block;height:100%;width:0;background:var(--sun);border-radius:99px;transition:width .4s}
.timer{position:relative;width:70px;height:70px;flex:none}
.timer svg{transform:rotate(-90deg)}
.timer circle{fill:#fff;stroke-width:9}
.timer .bg{stroke:#dfe6e9}.timer .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset 1s linear,stroke .3s}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--ink)}
.timer.low{animation:shake .4s infinite}
@keyframes shake{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.q{font-size:clamp(22px,5.4vw,30px);font-weight:800;text-align:center;margin:0 0 10px}
.scene{display:grid;place-items:center;margin:0 auto 14px;width:min(100%,300px);aspect-ratio:1.25;border-radius:26px;font-size:clamp(70px,22vw,110px);background:radial-gradient(circle at 30% 25%,#fff7d6,#ffe3f1 55%,#d6f0ff);border:5px solid #fff;box-shadow:inset 0 0 0 4px #ffeaa7;position:relative;animation:pop .5s}
.spk{position:absolute;right:8px;bottom:8px;width:48px;height:48px;border-radius:50%;background:var(--pri);color:#fff;font-size:22px;box-shadow:0 4px 0 #4834d4}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
.sent{text-align:center;font-size:clamp(20px,5vw,26px);font-weight:700;margin:0 0 12px}
.sent u{display:inline-block;min-width:90px;border-bottom:4px dashed var(--pri);color:var(--pri)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{background:#fff;border:4px solid #dfe6e9;border-radius:22px;padding:14px 8px;font-size:clamp(22px,6vw,32px);font-weight:800;color:var(--ink);box-shadow:0 6px 0 #b2bec3;transition:transform .12s,border-color .2s;animation:pop .45s backwards}
.opt.pic{font-size:clamp(50px,15vw,74px);padding:8px;line-height:1.1}
.opt:nth-child(1){background:#ffeaa7;animation-delay:.05s}.opt:nth-child(2){background:#fab1a0;animation-delay:.12s}.opt:nth-child(3){background:#81ecec;animation-delay:.19s}.opt:nth-child(4){background:#dfe6ff;animation-delay:.26s}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 #b2bec3}
.opt.good{border-color:var(--ok);background:#b8f5df!important;animation:jump .6s}
.opt.bad{border-color:var(--bad);background:#ffd5d5!important;animation:wob .5s}
.opts.lock .opt{pointer-events:none}
@keyframes jump{30%{transform:translateY(-16px) scale(1.08)}60%{transform:translateY(0) scale(.97)}}
@keyframes wob{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.fb{text-align:center;font-size:28px;font-weight:800;min-height:40px;margin-top:10px}
.stars{font-size:54px;text-align:center;letter-spacing:6px}
.score{font-size:64px;font-weight:800;text-align:center;color:var(--pri)}
.hide{display:none}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
footer{position:relative;z-index:1;max-width:760px;margin:10px auto 18px;padding:0 14px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
footer div{background:rgba(255,255,255,.88);color:var(--ink);border-radius:999px;padding:8px 18px;font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
footer .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#00b894;margin-right:6px;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
.mute{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:60;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.9);font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
</style>
</head>
<body>
<div class="deco" id="deco"></div>
<button class="mute" id="mute" aria-label="sound">🔊</button>
<canvas id="fx"></canvas>
<main>
  <section class="card" id="home">
    <div class="hero">🦁</div>
    <h1>Adjective Adventure!</h1>
    <p class="lead">Look, listen and choose the right word!</p>
    <div class="chips"><span>💪 strong</span><span>🦥 lazy</span><span>💖 kind</span><span>🥀 weak</span><span>🙈 shy</span><span>🦜 chatty</span><span>😴 tired</span><span>🤝 helpful</span></div>
    <button class="big" id="start">▶ START</button>
  </section>

  <section class="hide" id="game">
    <div class="top">
      <div class="pill" id="num">1/20</div>
      <div class="bar"><b id="prog"></b></div>
      <div class="pill">⭐ <span id="sc">0</span></div>
      <div class="timer" id="timer"><svg width="70" height="70" viewBox="0 0 70 70"><circle class="bg" cx="35" cy="35" r="29" fill="none"/><circle class="fg" id="ring" cx="35" cy="35" r="29" fill="none" stroke-dasharray="182.2" stroke-dashoffset="0"/></svg><span id="tt">15</span></div>
    </div>
    <div class="card">
      <p class="q" id="qtext"></p>
      <div class="scene hide" id="scene"><span id="sceneE"></span><button class="spk" id="spk" aria-label="listen">🔊</button></div>
      <p class="sent hide" id="sent"></p>
      <div class="opts" id="opts"></div>
      <div class="fb" id="fb"></div>
    </div>
  </section>

  <section class="card hide" id="end">
    <div class="hero" id="endE">🏆</div>
    <h1 id="endT">Great job!</h1>
    <div class="stars" id="endS"></div>
    <div class="score" id="endN"></div>
    <p class="lead" id="endM"></p>
    <button class="big" id="again">↻ PLAY AGAIN</button>
  </section>
</main>

<footer>
  <div><span class="dot"></span>Online now: <span id="live">1</span></div>
  <div>👀 Total visitors: <span id="total">…</span></div>
</footer>

<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a};

/* ---------- Content ---------- */
var ADJ=["strong","lazy","kind","weak","shy","chatty","tired","helpful"];
var D={
strong:{pics:["🏋️","🦸","🐘","🦍"],sent:[["🏋️","He is ___. He can lift a big box."],["🐘","The elephant is ___."],["🦸‍♀️","She is ___. She can carry two bags."]]},
lazy:{pics:["🦥","🛋️😴","🐱💤","😪🛋️"],sent:[["🦥","The sloth is ___. It sleeps all day."],["🛋️😴","He is ___. He does not want to work."],["🐱💤","The cat is ___. It sleeps on the sofa."]]},
kind:{pics:["👧🤝👵","🐶💖","🧒🎁","👦🐱"],sent:[["👧🐱","She helps a little cat. She is ___."],["🧒🍎🤝","He shares his apple. He is ___."],["👧🎁","The girl is ___. She gives a gift."]]},
weak:{pics:["🐭🎒","🤒","🐥📦","🤕"],sent:[["🐥📦","The baby bird cannot lift the box. It is ___."],["🐭🎒","The mouse is ___. The bag is too heavy!"],["🤒","The sick boy is ___. He cannot lift his bag."]]},
shy:{pics:["🙈","👧🙈","👦🙈","😳"],sent:[["👧🙈","The girl hides. She is ___."],["😳","He does not talk to new friends. He is ___."],["👦🙈","The boy covers his face. He is ___."]]},
chatty:{pics:["🦜💬","👧💬💬","🗣️","📞👦"],sent:[["🦜💬","The parrot talks and talks. It is ___."],["🗣️💬","He talks all day. He is ___."],["👧📞","The girl is ___. She loves to talk!"]]},
tired:{pics:["😴","🥱","🏃💦😩","🌙🛏️"],sent:[["🏃💦😩","I run a lot. Now I am ___."],["🥱","He yawns. He is ___."],["🌙🛏️","It is night. The boy is ___."]]},
helpful:{pics:["👦🧹","👧📚👩‍🏫","👦🛒👵","👧🧽"],sent:[["👦🧹","He cleans the room for mom. He is ___."],["👧📚👩‍🏫","She helps the teacher. She is ___."],["👦🌱","The boy is ___. He helps in the garden."]]}
};
function build(){
  var pool=[];
  ADJ.forEach(function(a){
    var p=shuffle(D[a].pics),s=shuffle(D[a].sent);
    pool.push({a:a,t:"p2w",e:p[0]},{a:a,t:"s2w",e:s[0][0],s:s[0][1]},{a:a,t:"w2p",e:p[2]},{a:a,t:"p2w",e:p[3]},{a:a,t:"s2w",e:s[1][0],s:s[1][1]},{a:a,t:"w2p",e:p[1]});
  });
  pool=shuffle(pool);
  var pick=[],seen={};
  pool.forEach(function(q){if((seen[q.a]||0)<2){pick.push(q);seen[q.a]=(seen[q.a]||0)+1}});
  pool.forEach(function(q){if(pick.length<20&&pick.indexOf(q)<0)pick.push(q)});
  return shuffle(pick).slice(0,20);
}

/* ---------- Audio (Web Audio, layered + reverb) ---------- */
var AC=null,master=null,wet=null,muted=false;
function audio(){
  if(AC)return AC;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.8;
    var comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);
    var len=AC.sampleRate*1.4,buf=AC.createBuffer(2,len,AC.sampleRate);
    for(var c=0;c<2;c++){var d=buf.getChannelData(c);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
    var cv=AC.createConvolver();cv.buffer=buf;wet=AC.createGain();wet.gain.value=.22;cv.connect(wet);wet.connect(comp);master.connect(cv);
  }catch(e){AC=null}
  return AC;
}
function tone(f,t0,dur,type,vol,slide){
  if(!AC||muted)return;
  var o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain(),now=AC.currentTime+t0;
  o.type=type||"sine";o2.type="sine";o.frequency.setValueAtTime(f,now);o2.frequency.setValueAtTime(f*2,now);
  if(slide){o.frequency.exponentialRampToValueAtTime(slide,now+dur)}
  var g2=AC.createGain();g2.gain.value=.25;o2.connect(g2);g2.connect(g);o.connect(g);
  g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(vol||.25,now+.012);g.gain.exponentialRampToValueAtTime(.0008,now+dur);
  g.connect(master);o.start(now);o2.start(now);o.stop(now+dur+.05);o2.stop(now+dur+.05);
}
var N={C5:523.25,D5:587.33,E5:659.25,G5:783.99,A5:880,C6:1046.5,E6:1318.5,G6:1568};
var S={
  click:function(){tone(700,0,.08,"triangle",.15)},
  tick:function(){tone(1200,0,.05,"square",.06)},
  ok:function(){[N.C5,N.E5,N.G5,N.C6].forEach(function(f,i){tone(f,i*.08,.45,"triangle",.22)});tone(N.E6,.34,.6,"sine",.18)},
  bad:function(){tone(280,0,.3,"sawtooth",.12,140);tone(200,.18,.35,"sawtooth",.1,100)},
  low:function(){tone(880,0,.09,"square",.1)},
  win:function(){[N.C5,N.E5,N.G5,N.C6,N.G5,N.C6,N.E6,N.G6].forEach(function(f,i){tone(f,i*.12,.5,"triangle",.22)});tone(N.C6,1,1.1,"sine",.25)}
};
function play(n){if(muted)return;audio();if(AC&&AC.state==="suspended")AC.resume();S[n]&&S[n]()}
function say(t){
  if(muted||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t.replace(/_+/g,"blank"));u.lang="en-US";u.rate=.8;u.pitch=1.15;
    var v=speechSynthesis.getVoices().filter(function(x){return /en[-_]US|en[-_]GB/.test(x.lang)});
    var best=v.filter(function(x){return /Google|Samantha|Natural|Aria|Jenny/i.test(x.name)})[0]||v[0];if(best)u.voice=best;
    speechSynthesis.speak(u)}catch(e){}
}
$("mute").onclick=function(){muted=!muted;this.textContent=muted?"🔇":"🔊";if(muted&&window.speechSynthesis)speechSynthesis.cancel();else play("click")};

/* ---------- Confetti ---------- */
var cv=$("fx"),cx=cv.getContext("2d"),parts=[],raf=0;
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener("resize",fit);
function burst(n,big){
  var cols=["#ff7675","#fdcb6e","#55efc4","#74b9ff","#a29bfe","#fd79a8"],em=["⭐","✨","🎉","🎈"];
  for(var i=0;i<n;i++){parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.45,vx:(Math.random()-.5)*(big?18:12),vy:-Math.random()*(big?18:13)-4,r:Math.random()*7+4,c:cols[i%6],rot:Math.random()*6,vr:(Math.random()-.5)*.4,e:Math.random()<.18?em[i%4]:null,l:1})}
  if(!raf)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(function(p){return p.l>0&&p.y<cv.height+30});
  parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.vx*=.99;p.rot+=p.vr;p.l-=.006;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.globalAlpha=Math.max(p.l,0);
    if(p.e){cx.font="24px serif";cx.fillText(p.e,-12,8)}else{cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r)}cx.restore()});
  raf=parts.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,cv.width,cv.height);
}

/* ---------- Game ---------- */
var Q=[],i=0,score=0,tl=15,tm=null,locked=false,cur=null,streak=0;
var C=2*Math.PI*29;
function show(id){["home","game","end"].forEach(function(x){$(x).classList.toggle("hide",x!==id)})}
function startGame(){Q=build();i=0;score=0;streak=0;$("sc").textContent=0;show("game");next()}
function next(){
  if(i>=Q.length)return finish();
  cur=Q[i];locked=false;$("fb").textContent="";
  $("num").textContent=(i+1)+"/"+Q.length;$("prog").style.width=(i/Q.length*100)+"%";
  var o=$("opts");o.className="opts";o.innerHTML="";
  var sc=$("scene"),se=$("sent");sc.classList.add("hide");se.classList.add("hide");
  var right=cur.a,words=shuffle([right].concat(shuffle(ADJ.filter(function(a){return a!==right})).slice(0,3)));
  if(cur.t==="w2p"){
    $("qtext").textContent="Which picture is “"+right+"”?";
    var pics=[D[right].pics[0]==cur.e?cur.e:cur.e];var others=shuffle(ADJ.filter(function(a){return a!==right})).slice(0,3).map(function(a){return shuffle(D[a].pics)[0]});
    var all=shuffle([{e:cur.e,ok:true}].concat(others.map(function(e){return{e:e,ok:false}})));
    all.forEach(function(x){btn(x.e,x.ok,true)});
    setTimeout(function(){say(right)},300);
  }else{
    sc.classList.remove("hide");$("sceneE").textContent=cur.e;sc.style.animation="none";void sc.offsetWidth;sc.style.animation="";
    if(cur.t==="s2w"){$("qtext").textContent="Choose the right word!";se.classList.remove("hide");se.innerHTML=cur.s.replace("___","<u>&nbsp;?&nbsp;</u>");setTimeout(function(){say(cur.s)},300)}
    else{$("qtext").textContent="How is he, she or it?"}
    words.forEach(function(w){btn(w,w===right,false)});
  }
  startTimer();
}
function btn(label,ok,pic){
  var b=document.createElement("button");b.className="opt"+(pic?" pic":"");b.textContent=label;b.dataset.ok=ok?"1":"";
  b.onclick=function(){answer(b,ok)};$("opts").appendChild(b);
}
$("spk").onclick=function(e){e.stopPropagation();play("click");say(cur&&cur.t==="s2w"?cur.s:(cur?cur.a:""))};
function startTimer(){
  clearInterval(tm);tl=15;upd();
  tm=setInterval(function(){tl--;upd();if(tl<=5&&tl>0)play("low");else if(tl>5)play("tick");if(tl<=0){clearInterval(tm);answer(null,false,true)}},1000);
}
function upd(){
  $("tt").textContent=tl;var r=$("ring");r.style.strokeDashoffset=C*(1-tl/15);
  r.style.stroke=tl<=5?"#ff7675":tl<=9?"#fdcb6e":"#00b894";$("timer").classList.toggle("low",tl<=5);
}
function answer(b,ok,timeout){
  if(locked)return;locked=true;clearInterval(tm);
  $("opts").classList.add("lock");
  var btns=[].slice.call($("opts").children);
  if(ok){
    score++;streak++;$("sc").textContent=score;b.classList.add("good");play("ok");burst(streak>=3?130:80,streak>=3);
    var m=["Great!","Awesome!","Super!","Well done!","Perfect!","Yes! You did it!"];$("fb").style.color="#00b894";$("fb").textContent=(streak>=3?"🔥 "+streak+" in a row! ":"🎉 ")+m[Math.floor(Math.random()*m.length)];
  }else{
    streak=0;if(b)b.classList.add("bad");play("bad");btns.forEach(function(x){if(x.dataset.ok)x.classList.add("good")});
    $("fb").style.color="#e17055";$("fb").textContent=timeout?"⏰ Time is up!":"Oops! Try the next one 💪";
  }
  if(cur.t==="s2w"||cur.t==="p2w")setTimeout(function(){say(cur.a)},ok?500:650);
  i++;setTimeout(next,ok?1700:2300);
}
function finish(){
  $("prog").style.width="100%";show("end");var pct=score/Q.length;
  var st=pct>=.9?3:pct>=.6?2:pct>=.3?1:0;
  $("endS").textContent="⭐".repeat(st)+"☆".repeat(3-st);
  $("endN").textContent=score+" / "+Q.length;
  $("endE").textContent=pct>=.9?"🏆":pct>=.6?"🥳":"🌈";
  $("endT").textContent=pct>=.9?"You are a Star!":pct>=.6?"Great job!":"Good try!";
  $("endM").textContent=pct>=.6?"You know many adjectives!":"Play again and get more stars!";
  play("win");burst(220,true);setTimeout(function(){burst(160,true)},700);
}
$("start").onclick=function(){audio();if(AC&&AC.state==="suspended")AC.resume();play("click");startGame()};
$("again").onclick=function(){play("click");startGame()};

/* ---------- Visitor counters (GitHub Pages version) ----------
   Total visitors: works out of the box (free abacus counter API).
   Online now: set FIREBASE_URL to your free Firebase Realtime Database URL (see README). */
var FIREBASE_URL="";   // e.g. "https://my-quiz-default-rtdb.firebaseio.com"
(function(){
  var KEY="aq_counted",fmt=function(n){return Number(n).toLocaleString("en-US")};
  var counted=false;try{counted=!!sessionStorage.getItem(KEY)}catch(e){}
  var base=FIREBASE_URL.replace(/\/$/,"");
  function mark(){try{sessionStorage.setItem(KEY,"1")}catch(e){}}
  var liveBox=$("live").parentNode;
  if(base){
    var t0=counted?Promise.resolve():fetch(base+"/.json",{method:"PATCH",body:JSON.stringify({total:{".sv":{"increment":1}}})}).then(mark);
    t0.then(function(){return fetch(base+"/total.json")}).then(function(r){return r.json()}).then(function(n){$("total").textContent=fmt(n||1)}).catch(function(){$("total").textContent="—"});
    var id=Math.random().toString(36).slice(2,10);
    var beat=function(){
      fetch(base+"/live/"+id+".json",{method:"PUT",body:JSON.stringify({".sv":"timestamp"})})
      .then(function(){return fetch(base+"/live.json")}).then(function(r){return r.json()}).then(function(o){
        o=o||{};var ks=Object.keys(o),mx=0,c=0;ks.forEach(function(k){if(o[k]>mx)mx=o[k]});
        ks.forEach(function(k){if(mx-o[k]<45000)c++;else fetch(base+"/live/"+k+".json",{method:"DELETE"}).catch(function(){})});
        $("live").textContent=Math.max(1,c);
      }).catch(function(){});
    };
    beat();setInterval(beat,15000);
    addEventListener("pagehide",function(){try{fetch(base+"/live/"+id+".json",{method:"DELETE",keepalive:true})}catch(e){}});
  }else{
    liveBox.style.display="none";
    var ns=(location.hostname||"local").replace(/[^a-z0-9]/gi,"-")+"-"+(location.pathname.replace(/[^a-z0-9]/gi,"-")||"root");
    fetch("https://abacus.jasoncameron.dev/"+(counted?"get":"hit")+"/"+ns.slice(0,60)+"/visits")
    .then(function(r){return r.json()}).then(function(d){mark();$("total").textContent=fmt(d.value||1)}).catch(function(){$("total").textContent="—"});
  }
})();
})();
</script>
